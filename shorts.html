<script>
fetch("shorts.json")
.then(function(r){if(!r.ok)throw 0;return r.json();})

.sort(function(a,b){return b.name.localeCompare(a.name);});

function cap(n){return caps[n]||n.replace(/\.mp4$/i,"");}
var d=cap(v.name);
return '<div class="sv-item tap"><video preload="metadata" playsinline poster="shorts/'+encodeURIComponent(v.name.replace(/\.mp4$/i,".jpg"))+'"><source src="shorts/'+encodeURIComponent(v.name)+'" type="video/mp4"></video><span class="tap-play"><span>▶</span></span><p class="t" style="white-space:pre-line">'+d+'</p><p style="padding:0 14px 14px;margin:0;margin-top:auto"><a class="btn dl" href="shorts/'+encodeURIComponent(v.name)+'" download="'+v.name+'">下載</a></p></div>';
}).join("");

function showInline(v){v.setAttribute("controls","");v.style.pointerEvents="auto";var b=v.parentNode.querySelector(".tap-play");if(b)b.style.display="none";}
document.addEventListener("fullscreenchange",function(){if(document.fullscreenElement)return;var vs=document.querySelectorAll("video");for(var i=0;i<vs.length;i++){vs[i].pause();showInline(vs[i]);}});
