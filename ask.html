<script>
(function(){
  var DB = [];
  var currentMode = "all";

  // 生活白話 ↔ 佛法同義詞擴展表
  var SYNONYMS = [
    ["焦慮","不安","緊張","心亂","煩躁","失眠","睡不著","壓力","恐懼","害怕","不要怕","安心","安住","靜心","平常心","定力"],
    ["眼光","標籤","批評","被罵","流言","別人怎麼看","比較","自卑","傲慢","優越感","做自己","不在乎","分別心","內耗"],
    ["生氣","憤怒","仇恨","怨恨","委屈","原諒","傷害","報復","刀子口","溝通","說話","人際","關係","家庭","父母","教養","忍辱","慈悲"],
    ["執著","放不下","放下","想太多","算計","糾結","卡住","痛苦","煩惱","轉念","解脫","自在","隨緣"],
    ["無常","失去","過世","往生","死亡","生死","生病","老病","失智","助念","回向","因果","業力","宿命","命運"],
    ["打坐","靜坐","禪修","冥想","妄想","雜念","昏沉","盤腿","呼吸","數息","觀心","止觀","半日禪","正念"],
    ["空性","無我","緣起","假有","中道","三諦","三觀","天台","始終心要","般若","金剛經","六如偈","如幻","無相"],
    ["工作","職場","退休","賺錢","名利","選擇","迷惘","方向","精進","拜佛","誦經","普門品","法華經","六祖壇經","華嚴經","戒律","十善","八關齋戒"]
  ];

  var STOP = {"請問":1,"師父":1,"法師":1,"見額":1,"什麼":1,"怎麼":1,"如何":1,"為什麼":1,"可以":1,"應該":1,"覺得":1,"自己":1,"一直":1,"一個":1,"我們":1,"你們":1,"他們":1,"這個":1,"那個":1,"怎麼辦":1,"好嗎":1,"嗎":1,"呢":1,"吧":1,"啊":1,"的":1,"了":1,"是":1,"在":1,"有":1,"和":1,"與":1,"或":1,"都":1,"很":1,"太":1,"不":1};

  function fmtDur(sec){
    sec = parseInt(sec,10) || 0;
    if(!sec) return "";
    var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
    if(h > 0) return h + "小時" + (m<10?"0":"") + m + "分";
    return m + "分" + (s<10?"0":"") + s + "秒";
  }

  function extractTokens(q){
    q = (q || "").trim().toLowerCase();
    if(!q) return {direct:[], expanded:[]};
    var clean = q.replace(/[，。！？、；：「」『』（）()【】《》#｜|.,!?;:'"\s]+/g, " ").trim();
    var parts = clean.split(" ").filter(Boolean);
    var direct = [];
    var seen = {};
    function addD(w){
      if(!w || w.length < 2 || STOP[w] || seen[w]) return;
      seen[w] = 1;
      direct.push(w);
    }
    // 先加入整段詞與各分詞
    for(var i=0;i<parts.length;i++){
      var p = parts[i];
      if(p.length <= 4) addD(p);
      // 檢查是否包含同義詞表裡的詞彙
      for(var g=0;g<SYNONYMS.length;g++){
        for(var k=0;k<SYNONYMS[g].length;k++){
          var kw = SYNONYMS[g][k].toLowerCase();
          if(p.indexOf(kw) !== -1) addD(kw);
        }
      }
      // 2字滑動切詞（處理中文連續句子）
      if(/[\u4e00-\u9fa5]/.test(p) && p.length >= 2){
        for(var j=0;j<p.length-1;j++){
          var bi = p.slice(j, j+2);
          if(!STOP[bi]) addD(bi);
        }
      } else {
        addD(p);
      }
    }
    // 同義詞擴展
    var expanded = [];
    var expSeen = {};
    for(var g=0;g<SYNONYMS.length;g++){
      var group = SYNONYMS[g];
      var hit = false;
      for(var k=0;k<group.length;k++){
        var w = group[k].toLowerCase();
        if(q.indexOf(w) !== -1 || seen[w]){ hit = true; break; }
      }
      if(hit){
        for(var k=0;k<group.length;k++){
          var ew = group[k].toLowerCase();
          if(!seen[ew] && !expSeen[ew]){
            expSeen[ew] = 1;
            expanded.push(ew);
          }
        }
      }
    }
    return {direct: direct, expanded: expanded};
  }

  function highlight(text, tokens){
    if(!text) return "";
    var safe = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    var words = tokens.direct.slice(0, 8);
    words.sort(function(a,b){return b.length - a.length;});
    for(var i=0;i<words.length;i++){
      var w = words[i].replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      if(w.length >= 2){
        safe = safe.replace(new RegExp("(" + w + ")", "gi"), '<span class="hl">$1</span>');
      }
    }
    return safe;
  }

  function scoreItem(item, tokens){
    var score = 0;
    var titleL = (item.title || "").toLowerCase();
    var descL = (item.desc || "").toLowerCase();
    var catL = (item.cats || []).join(" ").toLowerCase();
    var matchedCh = [];

    // 直接詞命中
    for(var i=0;i<tokens.direct.length;i++){
      var w = tokens.direct[i];
      var weight = w.length >= 3 ? 1.4 : 1.0;
      if(titleL.indexOf(w) !== -1) score += 12 * weight;
      if(catL.indexOf(w) !== -1) score += 7 * weight;
      if(descL.indexOf(w) !== -1) score += 5 * weight;
    }

    // 同義詞延伸命中
    for(var i=0;i<tokens.expanded.length;i++){
      var ew = tokens.expanded[i];
      if(titleL.indexOf(ew) !== -1) score += 4.5;
      if(catL.indexOf(ew) !== -1) score += 2.5;
      if(descL.indexOf(ew) !== -1) score += 2;
    }

    // 時間軸章節精準命中
    if(item.ch && item.ch.length){
      for(var c=0;c<item.ch.length;c++){
        var ch = item.ch[c];
        var cl = ch.l.toLowerCase();
        var chScore = 0;
        for(var i=0;i<tokens.direct.length;i++){
          var w = tokens.direct[i];
          if(cl.indexOf(w) !== -1) chScore += (w.length >= 3 ? 14 : 9);
        }
        for(var i=0;i<tokens.expanded.length;i++){
          var ew = tokens.expanded[i];
          if(cl.indexOf(ew) !== -1) chScore += 3.5;
        }
        if(chScore > 0){
          matchedCh.push({t: ch.t, ts: ch.ts, l: ch.l, s: chScore});
        }
      }
      matchedCh.sort(function(a,b){return b.s - a.s;});
      if(matchedCh.length){
        score += matchedCh[0].s + Math.min(matchedCh.length - 1, 2) * 3;
      }
    }

    // 偏好模式微調
    if(currentMode === "short" && item.type !== "short") score *= 0.25;
    if(currentMode === "video" && item.type !== "video") score *= 0.25;

    return {item: item, score: score, matchedCh: matchedCh.slice(0, 3)};
  }

  function pickTop3(q){
    var tokens = extractTokens(q);
    var scored = [];
    for(var i=0;i<DB.length;i++){
      var r = scoreItem(DB[i], tokens);
      if(r.score > 0) scored.push(r);
    }
    scored.sort(function(a,b){return b.score - a.score;});

    // 若沒有任何字面命中，給出預設最受歡迎的安頓三講
    if(!scored.length){
      var defaults = ["6waz7csBgOg", "mp4HNYH7Saw", "N6mARZWYGu4", "LFQRgKjTrsM"];
      for(var i=0;i<DB.length;i++){
        if(defaults.indexOf(DB[i].id) !== -1){
          scored.push({item: DB[i], score: 1, matchedCh: (DB[i].ch||[]).slice(0,2)});
        }
      }
    }

    // 在「自動推薦」模式下，確保長片與短片兼顧且不重複同系列塞滿
    var picked = [];
    var usedId = {};
    for(var i=0;i<scored.length && picked.length < 3;i++){
      var cand = scored[i];
      if(usedId[cand.item.id]) continue;
      picked.push(cand);
      usedId[cand.item.id] = 1;
    }
    return {picked: picked, totalMatched: scored.length, tokens: tokens};
  }

  function render(q){
    if(!DB.length) return;
    var res = pickTop3(q);
    var grid = document.getElementById("res-grid");
    var titleEl = document.getElementById("res-title");
    var metaEl = document.getElementById("res-meta");

    if(q && q.trim()){
      titleEl.textContent = "針對「" + q.trim() + "」為您挑選的 3 部開示";
      metaEl.textContent = "從 509 部開示與 323 個時間軸片段中檢索出 " + res.totalMatched + " 部相關法音";
    } else {
      titleEl.textContent = "初次到訪・為您推薦的 3 部入門開示";
      metaEl.textContent = "题庫已載入：共 509 部開示、323 個時間軸章節片段";
    }

    var rankLabels = ["第一推薦｜最契合主題", "第二推薦｜延伸觀照", "第三推薦｜日常落實"];
    grid.innerHTML = res.picked.map(function(entry, idx){
      var v = entry.item;
      var isShort = v.type === "short";
      var badge = isShort ? "短開示 · 1–3 分鐘" : "完整講經開示";
      var dur = fmtDur(v.dur);
      var cats = (v.cats && v.cats.length ? v.cats : (isShort ? ["短開示"] : ["講經開示"])).slice(0,2);
      var firstCh = entry.matchedCh && entry.matchedCh.length ? entry.matchedCh[0] : null;
      var watchUrl = "https://www.youtube.com/watch?v=" + v.id + (firstCh ? "&t=" + firstCh.t + "s" : "");
      var thumb = "https://i.ytimg.com/vi/" + v.id + "/hqdefault.jpg";

      var chHtml = "";
      var chToShow = entry.matchedCh.length ? entry.matchedCh : (v.ch ? v.ch.slice(0, 3) : []);
      if(chToShow.length){
        chHtml = '<div class="ch-box"><div class="ch-head">' +
          (entry.matchedCh.length ? '🎯 影片內直接解答您問題的片段（點時間直接跳轉）：' : '📑 本片重點章節片段：') +
          '</div><ul class="ch-list">' +
          chToShow.map(function(c){
            var u = "https://www.youtube.com/watch?v=" + v.id + "&t=" + c.t + "s";
            return '<li><a class="ch-link" href="' + u + '" target="_blank" rel="noopener"><span class="ch-time">▶ ' + c.ts + '</span><span>' + highlight(c.l, res.tokens) + '</span></a></li>';
          }).join("") +
          '</ul></div>';
      }

      var primaryBtnText = firstCh ? ("從 " + firstCh.ts + " 精華片段開始看") : (isShort ? "觀看短開示" : "觀看完整開示");

      return '<div class="rcard">' +
        '<a class="rthumb" href="' + watchUrl + '" target="_blank" rel="noopener">' +
          '<img src="' + thumb + '" alt="" loading="lazy">' +
          '<span class="rbadge">' + badge + '</span>' +
          (dur ? '<span class="rdur">' + dur + '</span>' : '') +
        '</a>' +
        '<div class="rbody">' +
          '<div>' +
            '<div><span class="rrank">' + rankLabels[idx] + '</span>' +
              cats.map(function(c){return '<span class="rcat">' + c + '</span>';}).join("") +
            '</div>' +
            '<h3 class="rtitle"><a href="' + watchUrl + '" target="_blank" rel="noopener">' + highlight(v.title, res.tokens) + '</a></h3>' +
            (v.desc ? '<p class="rdesc">' + highlight(v.desc, res.tokens) + '</p>' : '') +
            chHtml +
          '</div>' +
          '<div class="ract">' +
            '<a class="btn solid" href="' + watchUrl + '" target="_blank" rel="noopener">▶ ' + primaryBtnText + '</a>' +
            (firstCh ? '<a class="btn" href="https://www.youtube.com/watch?v=' + v.id + '" target="_blank" rel="noopener">從頭觀看全片</a>' : '') +
          '</div>' +
        '</div>' +
      '</div>';
    }).join("");
  }

  var input = document.getElementById("ask-input");
  document.getElementById("ask-form").addEventListener("submit", function(){
    render(input.value);
  });
  input.addEventListener("input", function(){
    render(input.value);
  });

  var chips = document.querySelectorAll(".chip");
  for(var i=0;i<chips.length;i++){
    chips[i].addEventListener("click", function(){
      for(var j=0;j<chips.length;j++) chips[j].classList.remove("active");
      this.classList.add("active");
      var q = this.getAttribute("data-q");
      input.value = q;
      render(q);
    });
  }

  var fbtns = document.querySelectorAll(".fbtn");
  for(var i=0;i<fbtns.length;i++){
    fbtns[i].addEventListener("click", function(){
      for(var j=0;j<fbtns.length;j++) fbtns[j].classList.remove("on");
      this.classList.add("on");
      currentMode = this.getAttribute("data-mode");
      render(input.value);
    });
  }

  fetch("dharma-ask.json")
    .then(function(r){return r.json();})
    .then(function(data){
      DB = data;
      var params = new URLSearchParams(location.search);
      var initQ = params.get("q") || "很在意別人眼光，被貼標籤怎麼辦";
      input.value = initQ;
      render(initQ);
    })
    .catch(function(){
      document.getElementById("res-meta").textContent = "題庫載入失敗，請稍後重試。";
    });
})();
</script>
